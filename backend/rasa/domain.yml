responses:
  utter_greet:
  - text: |
      Hello! I'm your **NBA/OBE Assistant** — powered by LangGraph + Rasa NLU.

      I guide faculty through the complete OBE workflow:
      **Step 1** → CO Generation | **Step 2** → CO-PO-PSO Mapping
      **Step 3** → Exam Configuration | **Step 4** → Question→CO Mapping
      **Step 5** → Marks Entry | **Step 6** → Attainment Calculation | **Step 7** → Reports

      What would you like to do today?

  utter_goodbye:
  - text: "Goodbye! Your OBE data is saved. Come back anytime for attainment calculations or reports."

  utter_out_of_scope:
  - text: |
      I'm specialised in NBA/OBE. I can help with:
      CO generation, CO-PO-PSO mapping, exam configuration, marks entry,
      attainment calculation (Direct/Indirect/80:20 blend), gap analysis, and NBA reports.
      Please rephrase your question in OBE terms.

  utter_help:
  - text: |
      **NBA/OBE Assistant — Available Commands:**

      | Step | Feature | Example |
      |------|---------|---------|
      | 1 | Generate COs | "Generate COs for my course" |
      | 2 | CO-PO Mapping | "Map COs to POs" |
      | 3 | Configure Exam | "Setup T1 exam" |
      | 4 | Question→CO Map | "Map questions to COs" |
      | 5 | Enter Marks | "Upload student marks" |
      | 6 | CO Attainment | "Calculate CO attainment" |
      | 6 | PO Attainment | "Calculate PO attainment" |
      | 7 | Reports | "Generate NBA report" |
      | + | Gap Analysis | "Show gap analysis" |
      | + | Bloom Level | "What BT level is this question?" |
      | + | NBA Standards | "Show all 12 POs" |

  utter_ask_course_id:
  - text: "Which course would you like to work with? Please provide the course code (e.g., CS301)."

  utter_ask_course_info:
  - text: |
      To begin CO generation, I need:
      1. **Course name** (e.g., Data Structures and Algorithms)
      2. **Course code** (e.g., CS301)
      3. **Credits** (e.g., 4)

      Please provide these details.

  utter_ask_syllabus:
  - text: |
      **Step 1 of 7 — Syllabus**
      Please paste your complete course syllabus (unit-wise topics).
      Minimum 50 characters required. Or type **'use existing'** if a syllabus is already saved.

  utter_ask_po_pso:
  - text: |
      **Step 2 of 7 — PO/PSO Alignment**
      Shall I fetch your program's POs and PSOs and align the COs to them?
      - Reply **'yes'** to include NBA standard PO alignment
      - Reply **'skip'** to generate COs without PO mapping

  utter_ask_co_count:
  - text: |
      **Step 3 of 7 — CO Count**
      How many Course Outcomes do you want to generate?
      NBA recommends **4 to 6 COs** per course.
      Reply with **4**, **5**, or **6**.

  utter_ask_exam_type:
  - text: |
      What type of exam is this?
      - **T1, T2, T3, T4, T5** — Formative Assessment (FA)
      - **SEE** — Summative End-Semester Exam (SA)
      - **Assignment** or **Practical**

  utter_ask_max_marks:
  - text: "What is the maximum marks for this exam? (e.g., 20 for T1, 100 for SEE)"

  utter_ask_question_marks:
  - text: |
      Please provide marks for each question.
      Format: Q1: 10 marks, Q2: 15 marks, Q3: 25 marks
      Also specify if there is internal choice (e.g., 'Answer 5 out of 8').

  utter_ask_fa_method:
  - text: |
      **FA Weighting Method** — Which method does your department use?
      1. **Best N of M** (NBA recommended) — Average of top N test scores. Default: Best 3 of 5.
      2. **Simple average** — Sum of all test% / number of tests
      3. **Weighted average** — T1=10%, T2=15%, T3=20%, T4=25%, T5=30%

      Reply with **1**, **2**, or **3**.

  utter_ask_threshold:
  - text: |
      **Attainment Threshold** — What percentage must a student score in a CO to be counted as 'passed'?
      - Default: **40%** of CO max marks
      - Options: 40%, 50%, or 60%

      Reply with **40**, **50**, or **60**.

  utter_ask_marks_format:
  - text: |
      **Student Marks Entry** — Choose your preferred format:
      1. **Manual entry** — Type marks for each student
      2. **CSV upload** — Columns: Student ID, Q1, Q2, Q3...
      3. **Excel upload** — One sheet per exam

      Which format would you like to use?

  utter_nba_attainment_levels:
  - text: |
      **NBA CO Attainment Level Classification:**

      | Level | Attainment % | Interpretation | NBA Status |
      |-------|-------------|----------------|------------|
      | Level 3 | ≥ 60% | Target fully achieved | Exceeds expectation |
      | Level 2 | 50–59% | Target mostly achieved | Meets expectation |
      | Level 1 | < 50% | Target not adequately met | **CAP Required** |

      Faculty defines the target level BEFORE the course starts.

  utter_nba_80_20_blend:
  - text: |
      **NBA 80:20 Direct/Indirect Blend:**

      `Final_CO_att = (Direct_CO_att × 0.80) + (Indirect_CO_att × 0.20)`

      - **Direct** = from exam marks (threshold-based)
      - **Indirect** = from student survey (Likert 1–5)

      Alternative blends accepted: 75:25 or 70:30
      (must be consistent across ALL courses in the department)

  utter_nba_po_list:
  - text: |
      **NBA Standard Program Outcomes (All 12 POs):**

      | PO | Short Name | Definition |
      |----|-----------|------------|
      | PO1 | Engineering knowledge | Apply mathematics, science, engineering fundamentals |
      | PO2 | Problem analysis | Identify, formulate, analyse complex engineering problems |
      | PO3 | Design/development | Design solutions for complex engineering problems |
      | PO4 | Conduct investigations | Use research-based knowledge and methods |
      | PO5 | Modern tool usage | Create, select, apply appropriate techniques and tools |
      | PO6 | Engineer & society | Assess societal, health, safety, legal issues |
      | PO7 | Environment & sustainability | Understand impact, demonstrate sustainable development |
      | PO8 | Ethics | Apply ethical principles and professional ethics |
      | PO9 | Individual & teamwork | Function effectively as individual and team member |
      | PO10 | Communication | Communicate effectively on engineering activities |
      | PO11 | Project management | Apply engineering and management principles |
      | PO12 | Life-long learning | Engage in independent and life-long learning |

      PO1–PO8 are technical POs. PO9–PO12 are generic/professional POs.

  utter_nba_best_n_of_m:
  - text: |
      **Best N of M FA Rule (NBA Recommended):**

      `FA_CO_att(CO_x) = Average of top N values from {T1%, T2%, T3%, T4%, T5%}`

      Default: **Best 3 of 5** tests.
      This rewards student improvement across the semester.

      Example: T1=60%, T2=55%, T3=75%, T4=80%, T5=70%
      Best 3 = {75%, 80%, 70%} → FA_att = (75+80+70)/3 = **75.0%**

  utter_mapping_scale:
  - text: |
      **CO-PO Mapping Correlation Scale (NBA Standard):**

      | Value | Correlation | Rule |
      |-------|------------|------|
      | 3 | High | CO directly and substantially addresses this PO |
      | 2 | Medium | CO partially addresses this PO |
      | 1 | Low | CO slightly or indirectly relates to this PO |
      | 0 | None | No meaningful connection — do NOT map to fill matrix |

      **Quality checks:**
      - Matrix density 30–60% non-zero cells is healthy
      - No CO should map to more than 7 POs with weight ≥ 2
      - PSO1 and PSO2 must each be mapped by at least 2 COs

  utter_po_attainment_formula:
  - text: |
      **Course-Level PO Attainment Formula:**

      `Course_PO_att(PO_x) = Σ(Final_CO_att(CO_i) × W(CO_i, PO_x)) / Σ(W(CO_i, PO_x))`

      **Example:**
      CO1 = 68% (weight=3), CO2 = 74% (weight=2), CO3 not mapped to PO1
      PO1_att = [(68×3) + (74×2)] / [3+2] = [204+148] / 5 = 352/5 = **70.4%**

  utter_gap_analysis_info:
  - text: |
      **Gap Analysis & CAP (Corrective Action Plan):**

      After every attainment calculation I automatically:
      1. Compare each CO against the faculty-defined target level
      2. Flag COs where achieved < target as **ATTAINMENT GAP**
      3. Identify weak questions, failing students, weak topics
      4. Suggest corrective actions:
         - **>15% below target**: Redesign CO, change teaching method, add remedial class
         - **10–15% below target**: Add practice problems, increase feedback frequency
         - **<10% below target**: Minor adjustment to question difficulty or marking scheme

