      - active_loop: null
        requested_slot: course_id

  course_code:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: course_code

  course_name:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: course_name

  course_credits:
    type: float
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: course_credits

  current_co_draft:
