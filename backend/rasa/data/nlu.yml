version: "3.1"

nlu:
- intent: greet
  examples: |
    - hello
    - hi
    - good morning
    - good afternoon
    - hey there
    - greetings
    - hi there
    - hello there

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you later
    - talk to you later
    - bye bye
    - farewell
    - catch you later
    - thanks, bye

- intent: affirm
  examples: |
    - yes
    - yeah
    - correct
    - right
    - that's right
    - exactly
    - sure
    - of course
    - definitely
    - absolutely

- intent: deny
  examples: |
