<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vignan's University</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    background: #000010;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
  }

  canvas#bg { position: fixed; inset: 0; z-index: 0; }

  .stage {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; gap: 30px;
    opacity: 0;
    animation: stageIn 1.5s 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes stageIn {
    from { opacity: 0; transform: scale(0.85) translateY(30px); }
    to   { opacity: 1; transform: scale(1)    translateY(0px); }
  }

  .logo-container {
    position: relative;
    width: 320px; height: 320px;
    display: flex; align-items: center; justify-content: center;
  }

  .logo-glow {
    position: absolute;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      rgba(120, 60, 255, 0.35) 0%,
      rgba(60, 100, 255, 0.15) 40%,
      transparent 70%);
    animation: glowPulse 3s ease-in-out infinite;
    filter: blur(20px);
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(0.9); opacity: 0.6; }
    50%       { transform: scale(1.2); opacity: 1.0; }
  }

  #logoCanvas {
    position: relative; z-index: 2;
    width: 300px; height: 300px;
    animation: spin360 10s linear infinite;
    filter:
      drop-shadow(0 0 20px rgba(130, 70, 255, 0.9))
      drop-shadow(0 0 50px rgba(80, 130, 255, 0.6))
      drop-shadow(0 0 100px rgba(130, 70, 255, 0.3));
  }
  @keyframes spin360 {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }

  .text-area {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: textIn 1.2s 1.2s ease both;
  }
  @keyframes textIn {
    from { opacity: 0; transform: translateY(20px); filter: blur(10px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0);    }
  }

  .vignan-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: 0.2em;
    background: linear-gradient(135deg, #ff8888 0%, #ff0000 30%, #cc0000 60%, #ff4444 100%);
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titleShimmer 4s linear infinite;
    position: relative;
  }
  @keyframes titleShimmer {
    0%   { background-position: 0%; }
    100% { background-position: 300%; }
  }

  .title-wrap {
    position: relative;
    display: inline-block;
  }
  .title-wrap::before {
    content: "VIGNAN'S";
    font-family: 'Orbitron', sans-serif;
    font-size: 3.5rem; font-weight: 900; letter-spacing: 0.2em;
    position: absolute; top: 6px; left: 4px;
    background: linear-gradient(135deg, #660000, #330000);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: blur(2px);
    opacity: 0.6;
    z-index: -1;
  }

  .foundation-text {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem; font-weight: 600;
    letter-spacing: 0.25em; text-transform: uppercase;
    color: rgba(200, 185, 255, 0.6);
  }

  .badge {
    padding: 5px 20px;
    border: 1px solid rgba(120, 90, 255, 0.3);
    border-radius: 999px;
    font-size: 0.65rem; letter-spacing: 0.18em;
    color: rgba(160, 150, 255, 0.55);
    background: rgba(80, 50, 180, 0.08);
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="stage">
  <div class="logo-container">
    <div class="logo-glow"></div>
    <canvas id="logoCanvas" width="600" height="600"></canvas>
  </div>

  <div class="text-area">
    <div class="title-wrap">
      <span class="vignan-title">VIGNAN'S</span>
    </div>
    <div class="foundation-text">Foundation for Science, Technology &amp; Research</div>
    <div class="badge">Deemed to be University &nbsp;·&nbsp; Estd. u/s 3 of UGC Act 1956</div>
    <a href="/home" style="margin-top: 30px; padding: 12px 30px; border: 1px solid rgba(120, 90, 255, 0.5); border-radius: 999px; font-size: 1rem; font-family: 'Orbitron', sans-serif; letter-spacing: 0.15em; color: white; background: rgba(80, 50, 180, 0.2); text-decoration: none; cursor: pointer; transition: 0.3s; z-index: 20;" onmouseover="this.style.background='rgba(80, 50, 180, 0.5)'" onmouseout="this.style.background='rgba(80, 50, 180, 0.2)'">ENTER PORTAL</a>
  </div>
</div>

<script>
// ── STARFIELD BACKGROUND ──
(function() {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H;
  const stars = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 300; i++) {
    stars.push({
      x: Math.random() * 10000,
      y: Math.random() * 10000,
      r: Math.random() * 1.5 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.008 + 0.002,
      color: Math.random() < 0.12 ? '#c8aaff' :
             Math.random() < 0.12 ? '#aaccff' : '#ffffff'
    });
  }

  let shoot = { active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 };
  function spawnShoot() {
    shoot.active = true;
    shoot.x = Math.random() * W * 0.5;
    shoot.y = Math.random() * H * 0.3;
    const angle = (Math.random() * 30 + 20) * Math.PI / 180;
    shoot.speed = 12 + Math.random() * 8;
    shoot.vx = Math.cos(angle) * shoot.speed;
    shoot.vy = Math.sin(angle) * shoot.speed;
    shoot.life = 1.0;
  }
  setInterval(spawnShoot, 4000);

  function draw() {
    ctx.fillStyle = 'rgba(0,0,16,0.25)';
    ctx.fillRect(0, 0, W, H);

    stars.forEach(s => {
      s.phase += s.speed;
      const alpha = (Math.sin(s.phase) + 1) / 2 * 0.7 + 0.15;
      ctx.beginPath();
      ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = alpha;
      ctx.fill();
    });

    if (shoot.active) {
      const len = 80;
      const grd = ctx.createLinearGradient(
        shoot.x - shoot.vx / shoot.speed * len, shoot.y - shoot.vy / shoot.speed * len,
        shoot.x, shoot.y
      );
      grd.addColorStop(0, 'rgba(255,255,255,0)');
      grd.addColorStop(1, `rgba(200,180,255,${shoot.life * 0.9})`);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = grd;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(shoot.x - shoot.vx / shoot.speed * len, shoot.y - shoot.vy / shoot.speed * len);
      ctx.lineTo(shoot.x, shoot.y);
      ctx.stroke();
      shoot.x += shoot.vx;
      shoot.y += shoot.vy;
      shoot.life -= 0.025;
      if (shoot.life <= 0 || shoot.x > W || shoot.y > H) shoot.active = false;
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── LOAD LOGO, STRIP BACKGROUND, DRAW TO CANVAS ──
(function() {
  const img = new Image();
  img.crossOrigin = "Anonymous";
  img.onload = function() {
    const off = document.createElement('canvas');
    off.width  = img.naturalWidth;
    off.height = img.naturalHeight;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);

    const imgData = octx.getImageData(0, 0, off.width, off.height);
    const px = imgData.data;

    const bgR = px[0], bgG = px[1], bgB = px[2];

    for (let i = 0; i < px.length; i += 4) {
      const r = px[i], g = px[i+1], b = px[i+2];
      const dist = Math.sqrt(
        (r - bgR) ** 2 +
        (g - bgG) ** 2 +
        (b - bgB) ** 2
      );
      const dark = r < 30 && g < 30 && b < 30;
      const fringe = dist < 55;
      if (fringe || dark) px[i + 3] = 0;
    }

    octx.putImageData(imgData, 0, 0);

    const dest = document.getElementById('logoCanvas');
    const dctx = dest.getContext('2d');
    dctx.clearRect(0, 0, dest.width, dest.height);
    dctx.drawImage(off, 0, 0, dest.width, dest.height);
  };
  // NOTE: Original base64 was too large. Falling back to placeholder-logo.png
  // Please replace with original base64 if needed.
  img.src = "/placeholder-logo.png";
})();
</script>
</body>
</html>
